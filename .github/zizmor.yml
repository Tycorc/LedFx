# - superfluous-actions: advisory action simplifications are not the lint gate.
rules:
  superfluous-actions:
    disable: true
  dangerous-triggers:
    ignore:
      - lint-notify.yml
      - pr-title.yml
  secrets-outside-env:
    # - release-notifications.yml: published releases and default-branch manual
    #   retries only, with code checked out from the default branch. It needs
    #   no second production approval. App contents-write persists delivery
    #   checkpoints; the sender cannot republish a release or run tag code.
    ignore:
      - ci.yml
      - lint-notify.yml
      - pr-title.yml
      - release-please.yml
      - release-notifications.yml
